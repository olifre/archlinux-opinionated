name: github pages via github actions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages, and purge old caches
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      #MDBOOK_VERSION: 0.4.36
      MDBOOK_VERSION: latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get date in ISO-8601
        run: echo "NOW_DATE=$(date -I)" >> $GITHUB_ENV
      - name: Set up cargo cache
        uses: actions/cache@v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.NOW_DATE }}
          restore-keys: ${{ runner.os }}-cargo
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf | sh -s -- -y
          rustup update
          if [ "${MDBOOK_VERSION}" = "latest" ]; then
            cargo install mdbook
          else
            cargo install --version ${MDBOOK_VERSION} mdbook
          fi
      - name: Install mdBook utils for sitemap generation
        run: |
          cargo install mdbook-utils
      #- name: Install mdBook linkcheck for link checking
      #  run: |
      #    cargo install mdbook-linkcheck
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Build sitemap with mdBook utils
        run: mdbook-utils sitemap -m src -b https://olifre.github.io/ -y
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book
          #path: ./book/html
      - name: Autoclean cargo cache
        run: |
          cargo install cargo-cache --no-default-features --features ci-autoclean cargo-cache
          cargo-cache

  clear-old-caches:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clear out old caches
        uses: MyAlbum/purge-cache@v2
        with:
          accessed: true # Purge caches by their last accessed time (default)
          created: false # Purge caches by their created time (default)
          max-age: 604800 # Leave only caches accessed in the last 7 days (default)

  # Deployment job
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
