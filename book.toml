[book]
title = "Installing ArchLinux the opinionated way"
authors = ["Oliver Freyermuth"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/olifre/archlinux-opinionated"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/olifre/archlinux-opinionated/edit/main/{path}"
site-url = "/archlinux-opinionated/"
additional-css = ["custom.css"]

[output.html.fold]
enable = true     # whether or not to enable section folding
level = 1         # the depth to start folding

#[output.linkcheck]
#follow-web-links = true
#traverse-parent-directories = false
#warning-policy = "error"
